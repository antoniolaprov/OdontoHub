# Nginx do frontend OdontoHub.
# Serve a SPA (React Router) e encaminha /api para o backend (container "backend").
server {
    listen 80;
    server_name _;

    # API → backend Spring Boot (rede interna do compose). Mantém o prefixo /api.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota cai no index.html (client-side routing).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
